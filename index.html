<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Digitale di Shubo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    
    <style>
        body { 
            text-align: center; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        h1 { margin-top: 40px; color: #58a6ff; }
        p { color: #8b949e; margin-bottom: 40px; }

        .container { max-width: 500px; margin: auto; }

        .card {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
            transition: all 0.3s ease;
            display: block;
            text-decoration: none;
        }

        /* Effetto quando passi il dito (Hover) */
        .card:active, .card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            background: #21262d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card h2 { margin: 0; font-size: 1.4rem; color: #f0f6fc; }
        .icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        
        .footer { margin-top: 50px; font-size: 0.8rem; color: #484f58; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="animate__animated animate__fadeInDown">✨ Il Mio Archivio</h1>
        <p class="animate__animated animate__fadeIn">Gestione documenti e cloud personale</p>

        <a href="https://drive.google.com/drive/folders/1j0Bket5cZ91YEoQ8LFsUpPfYMPZ6QJ8Y" 
           class="card animate__animated animate__backInLeft" style="animation-delay: 0.1s;">
            <span class="icon">💼</span>
            <h2>Lavoro</h2>
        </a>

        <a href="https://drive.google.com/drive/folders/1MZnUYAQtulbHd5E6nqfVVbGDv-94Yks3" 
           class="card animate__animated animate__backInLeft" style="animation-delay: 0.3s;">
            <span class="icon">📚</span>
            <h2>Scuola</h2>
        </a>

        <a href="https://drive.google.com/drive/folders/1OyT8SY4wmIts6x4OSwpdZCMyfA4aO5xr" 
           class="card animate__animated animate__backInLeft" style="animation-delay: 0.5s;">
            <span class="icon">🏠</span>
            <h2>Casa</h2>
        </a>

        <div class="footer animate__animated animate__fadeIn">
            Creato con GitHub Pages & Google Drive
        </div>
    </div>

</body>
</html>

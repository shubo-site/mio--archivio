<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Integrato Shubo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    
    <style>
        body { text-align: center; background-color: #0d1117; color: #c9d1d9; }
        .menu-canali { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-archivio { 
            padding: 10px 20px; background: #161b22; border: 1px solid #30363d; 
            border-radius: 8px; color: white; cursor: pointer; transition: 0.3s;
        }
        .btn-archivio:hover { border-color: #58a6ff; background: #21262d; }
        
        /* Contenitore per i file di Drive */
        #viewer-container {
            width: 100%;
            height: 600px;
            border: 2px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            background: white; /* Per vedere meglio i documenti */
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1 class="animate__animated animate__fadeInDown">✨ Il Mio Cloud Privato</h1>
    <p>Seleziona una cartella per visualizzare i file qui sotto</p>

    <div class="menu-canali animate__animated animate__fadeIn">
        <button class="btn-archivio" onclick="mostra('https://drive.google.com/embeddedfolderview?id=1j0Bket5cZ91YEoQ8LFsUpPfYMPZ6QJ8Y#list')">💼 Lavoro</button>
        <button class="btn-archivio" onclick="mostra('https://drive.google.com/embeddedfolderview?id=1MZnUYAQtulbHd5E6nqfVVbGDv-94Yks3#list')">📚 Scuola</button>
        <button class="btn-archivio" onclick="mostra('https://drive.google.com/embeddedfolderview?id=1OyT8SY4wmIts6x4OSwpdZCMyfA4aO5xr#list')">🏠 Casa</button>
    </div>

    <div id="viewer-container" class="animate__animated animate__zoomIn">
        <iframe id="drive-viewer" src="https://drive.google.com/embeddedfolderview?id=1j0Bket5cZ91YEoQ8LFsUpPfYMPZ6QJ8Y#list"></iframe>
    </div>

    <script>
        function mostra(link) {
            document.getElementById('drive-viewer').src = link;
        }
    </script>

</body>
</html>

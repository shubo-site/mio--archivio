<script>
    // Incolla qui il link del CSV che hai ottenuto da Google Sheets
    const sheetURL = "IL_TUO_LINK_PUBBLICATO_DA_GOOGLE_SHEETS";

    async function aggiornaDatiRealTime() {
        try {
            const response = await fetch(sheetURL);
            const data = await response.text();
            const righe = data.split('\n');

            // Leggiamo i valori dal foglio Google
            const totale = righe[0].split(',')[1];
            const risparmio = righe[1].split(',')[1];
            const guadagno = righe[2].split(',')[1];
            const spesa = righe[3].split(',')[1];

            // Aggiorniamo la grafica del sito
            document.querySelector('.total-amount').innerText = "€ " + totale;
            document.querySelectorAll('.stat-val')[0].innerText = "€ " + risparmio;
            document.querySelectorAll('.stat-val')[1].innerText = "€ " + guadagno;
            document.querySelectorAll('.stat-val')[2].innerText = "- € " + spesa;
        } catch (error) {
            console.log("Errore nel caricamento dati");
        }
    }

    // Carica i dati all'apertura
    aggiornaDatiRealTime();

    function switchTab(tabId, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function mostra(link) {
        document.getElementById('drive-viewer').src = link;
    }
</script>

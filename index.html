<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Shubo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    
    <style>
        body { text-align: center; background-color: #0d1117; color: #c9d1d9; }
        .main-nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .nav-btn { padding: 10px 40px; cursor: pointer; border-radius: 20px; border: 2px solid #30363d; background: #161b22; color: white; font-weight: bold; }
        .nav-btn.active { border-color: #58a6ff; background: #21262d; }
        
        .section { display: none; }
        .section.active { display: block; }

        /* Grafica Conto */
        .total-card { background: linear-gradient(145deg, #1f6feb, #114494); padding: 30px; border-radius: 20px; margin: 20px 0; }
        .total-amount { font-size: 3rem; font-weight: bold; margin: 10px 0; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: #161b22; padding: 15px; border-radius: 12px; border: 1px solid #30363d; }
        .stat-val { font-size: 1.2rem; font-weight: bold; display: block; }
        .minus { color: #ff7b72; }
        .plus { color: #3fb950; }

        .ai-input { width: 100%; padding: 15px; border-radius: 10px; background: #0d1117; border: 1px dashed #58a6ff; color: white; margin-top: 20px; }
        
        iframe { width: 100%; height: 500px; border-radius: 12px; border: 1px solid #30363d; background: white; }
    </style>
</head>
<body>

    <div class="main-nav">
        <button class="nav-btn active" onclick="switchTab('doc', this)">DOC</button>
        <button class="nav-btn" onclick="switchTab('conto', this)">CONTO</button>
    </div>

    <div id="doc" class="section active animate__animated animate__fadeIn">
        <h2>📂 I Miei Documenti</h2>
        <div style="margin-bottom: 15px;">
            <button onclick="mostra('https://drive.google.com/embeddedfolderview?id=1j0Bket5cZ91YEoQ8LFsUpPfYMPZ6QJ8Y#list')">Lavoro</button>
            <button onclick="mostra('https://drive.google.com/embeddedfolderview?id=1MZnUYAQtulbHd5E6nqfVVbGDv-94Yks3#list')">Scuola</button>
            <button onclick="mostra('https://drive.google.com/embeddedfolderview?id=1OyT8SY4wmIts6x4OSwpdZCMyfA4aO5xr#list')">Casa</button>
        </div>
        <iframe id="drive-viewer" src="https://drive.google.com/embeddedfolderview?id=1j0Bket5cZ91YEoQ8LFsUpPfYMPZ6QJ8Y#list"></iframe>
    </div>

    <div id="conto" class="section animate__animated animate__fadeIn">
        <div class="total-card">
            <span>BILANCIO TOTALE</span>
            <div class="total-amount">€ 100.010,00</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <small>RISPARMIO</small>
                <span class="stat-val">€ 40,00</span>
            </div>
            <div class="stat-box">
                <small>GUADAGNO</small>
                <span class="stat-val plus">€ 100.000,00</span>
            </div>
            <div class="stat-box">
                <small>SPESA</small>
                <span class="stat-val minus">- € 30,00</span>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: left;">
            <h3>🤖 Assistente IA Finanziario</h3>
            <textarea class="ai-input" placeholder="Scrivi qui: 'Ho speso 20€ per il pranzo' o 'Guadagnati 1000€'..."></textarea>
            <p style="font-size: 0.8rem; color: #8b949e;">L'IA elaborerà la frase e aggiornerà il tuo Google Sheet collegato.</p>
        </div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            // Nascondi tutte le sezioni
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            // Mostra quella selezionata
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function mostra(link) {
            document.getElementById('drive-viewer').src = link;
        }
    </script>
</body>
</html>
